name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit and API tests
        run: npm test

      - name: Firestore rules emulator tests
        run: npx firebase-tools@13 emulators:exec --only firestore --project zentra-rules-test "npm run test:rules"

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=moderate
